[supervisord]
nodaemon=true
logfile=/ceph-run/supervisor/supervisord.log
pidfile=/ceph-run/supervisor/supervisord.pid

[unix_http_server]
file=/ceph-run/supervisor/supervisor.sock

[supervisorctl]
serverurl=unix:///ceph-run/supervisor/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# OSD and per-subsystem programs (dashboard, RBD, RGW, MDS) are
# generated per boot by bootstrap.sh from OSD_COUNT and the ENABLE_ flags
[include]
files = /etc/supervisord.d/*.conf

[program:ceph-mon]
command=/scripts/run-mon.sh
autostart=true
autorestart=true
startsecs=10
priority=10
stdout_logfile=/ceph-run/supervisor/ceph-mon.log
stderr_logfile=/ceph-run/supervisor/ceph-mon-error.log

[program:mgr-bootstrap]
command=/scripts/setup-mgr.sh
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=0
priority=15
stdout_logfile=/ceph-run/supervisor/mgr-bootstrap.log
stderr_logfile=/ceph-run/supervisor/mgr-bootstrap-error.log

[program:ceph-mgr]
command=/scripts/run-mgr.sh
autostart=true
autorestart=true
startsecs=10
priority=20
stdout_logfile=/ceph-run/supervisor/ceph-mgr.log
stderr_logfile=/ceph-run/supervisor/ceph-mgr-error.log

[program:auth-setup]
command=/scripts/setup-auth.sh
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=0
priority=95
stdout_logfile=/ceph-run/supervisor/auth-setup.log
stderr_logfile=/ceph-run/supervisor/auth-setup-error.log
